# Referencia — copiar a .github/workflows/build-test.yml
name: Build and Test

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  GENESIS_REDIS_URL: redis://localhost:6379/0

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fakeredis

      - name: Ruff lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cp PlanContainerizacion/FASE_1/Dockerfile Dockerfile
          cp PlanContainerizacion/FASE_1/.dockerignore .dockerignore
          docker build -t genesis-api:${{ github.sha }} .

      - name: Verify image size
        run: |
          SIZE=$(docker images genesis-api:${{ github.sha }} --format "{{.Size}}")
          echo "Image size: $SIZE"

  # Smoke con OpenAI requiere secrets — ejecutar manualmente o en pipeline privado
  smoke-manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Smoke (requires secrets)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
        run: |
          docker compose -f PlanContainerizacion/FASE_1/docker-compose.yml up -d
          sleep 30
          pip install httpx
          python Test_local/run_mvp.py --smoke
