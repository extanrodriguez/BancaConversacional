apiVersion: apps/v1
kind: Deployment
metadata:
  name: banca-conversacional-api
  labels:
    app: banca-conversacional-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banca-conversacional-api
  template:
    metadata:
      labels:
        app: banca-conversacional-api
    spec:
      containers:
      - name: api
        image: your-registry/banca-conversacional-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: banca-conversacional-config
        - secretRef:
            name: banca-conversacional-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
