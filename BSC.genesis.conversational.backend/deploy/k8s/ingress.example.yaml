apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banca-conversacional-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: banca-conversacional.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: banca-conversacional-api
            port:
              number: 80
